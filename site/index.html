    <script>
      // Apply a remembered theme before first paint; storage may be blocked.
      try {
        var t = localStorage.getItem('fleetkit.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
